<!DOCTYPE html>
<html lang="ko">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DR3W5XWF50"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  /* 실제 주소(www)에서만 수집한다. 테스트·미리보기 주소는 제외.
     ?notrack=1 로 한 번 열면 이 브라우저는 계속 제외된다(?notrack=0 으로 해제). */
  (function(){var ID='G-DR3W5XWF50',off=location.hostname!=='www.selfregi24.com';
    try{var q=new URLSearchParams(location.search).get('notrack');
      if(q==='1')localStorage.setItem('sr_notrack','1');if(q==='0')localStorage.removeItem('sr_notrack');
      if(localStorage.getItem('sr_notrack')==='1')off=true;}catch(e){}
    if(off)window['ga-disable-'+ID]=true;gtag('config',ID);})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>결제 확인 | 셀프등기24</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F172A;--blue:#0369A1;--bg:#F8FAFC;--card:#fff;--text:#020617;--muted:#64748B;--border:#E2E8F0;--ok:#047857;--err:#B91C1C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;word-break:keep-all}
.wrap{max-width:480px;margin:0 auto;padding:40px 16px 60px}
.logo{font-size:15px;font-weight:800;color:var(--navy);text-decoration:none}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px 20px;margin-top:18px}
h1{font-size:20px;margin:0 0 10px;color:var(--navy)}
p{font-size:14.5px;line-height:1.7;color:#334155;margin:0 0 12px}
.st-ok h1{color:var(--ok)} .st-err h1{color:var(--err)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border-radius:12px;background:var(--navy);color:#fff;font-size:15.5px;font-weight:800;text-decoration:none;border:0;cursor:pointer;font-family:inherit;margin-top:6px}
.btn.sub{background:#F1F5F9;color:var(--navy)}
.re{background:#F0F9FF;border:1px solid #BAE6FD;border-radius:10px;padding:14px;margin:14px 0}
.re b{display:block;font-size:13.5px;color:#075985;margin-bottom:6px}
.re input{width:100%;font-size:12.5px;padding:10px;border:1px solid #BAE6FD;border-radius:8px;background:#fff;color:#0F172A}
.re small{display:block;font-size:12px;color:#475569;margin-top:6px;line-height:1.6}
.meta{font-size:12.5px;color:var(--muted)}
/* 이용권 보관(2026-10-10): 나에게 보내기 · 이용권 카드 이미지 */
.keep{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.keep .btn{margin:0;min-height:46px;font-size:14px}
.keep .btn.out{background:#fff;color:#075985;border:1px solid #7DD3FC}
.kept{font-size:12.5px;color:var(--ok);margin-top:8px;line-height:1.6}
.kept[hidden]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <a class="logo" href="/">셀프등기24</a>
  <div class="card" id="box" aria-live="polite">
    <h1>결제를 확인하고 있습니다</h1>
    <p>잠시만 기다려 주세요. 이 창을 닫지 마세요.</p>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function(){
  var PASS_KEY='selfregi_pass_v1', PENDING_KEY='selfregi_pay_pending';
  var box=document.getElementById('box');
  var q=new URLSearchParams(location.search);
  function get(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
  function set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  var pending=get(PENDING_KEY)||{};
  var from=(pending.from&&/^\/[\w\-./]*$/.test(pending.from))?pending.from:'/normal_form.html';
  var hasOpener=false; try{hasOpener=!!(window.opener&&window.opener.location.origin===location.origin);}catch(e){}

  function backBtn(label){
    return hasOpener
      ? '<button class="btn" onclick="window.close()">'+label+'</button>'
      : '<a class="btn" href="'+esc(from)+'">'+label+'</a>';
  }
  function fail(msg){
    box.className='card st-err';
    box.innerHTML='<h1>결제가 완료되지 않았습니다</h1><p>'+esc(msg)+'</p><p class="meta">결제 금액이 빠져나갔는데 이 화면이 보인다면 결제 시각과 함께 selfregi999@gmail.com으로 알려 주세요.</p>'+backBtn(hasOpener?'창 닫고 돌아가기':'서류 작성 화면으로 돌아가기');
  }

  if(q.get('cancel')){ fail('결제를 취소하셨습니다. 입력하신 내용은 원래 화면에 그대로 있습니다.'); return; }
  var orderNo=q.get('orderNo')||pending.orderNo;
  if(!orderNo){ fail('주문 정보를 찾지 못했습니다.'); return; }

  /* 페이앱(?pa=1): 결제 완료는 페이앱 서버의 결제통보로 확인한다. 통보가 화면 복귀보다 늦을 수 있어
     「확인 중」(202)이면 2초 간격으로 다시 묻는다(최대 약 30초). */
  var PA = q.get('pa')==='1' || pending.m==='payapp', waits=0;

  /* ── 이용권 보관(2026-10-10) ──
     ① 나에게 보내기: 휴대폰 공유창(카톡 나와의 채팅·문자·메일). 공유창이 없는 PC는 링크 복사.
     ② 이용권 카드: 주문번호·기한·링크·QR을 담은 이미지. 결제 직후 주문당 한 번 자동 저장, 버튼으로 다시 저장.
     카드는 이 브라우저에서 그려 바로 내려받는다(서버 전송 없음). */
  function trk(n,d){ try{ if(typeof gtag==='function') gtag('event',n,d||{}); }catch(e){} }
  function copy(link, btn){
    (navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject())
      .then(function(){ btn.textContent='복사했습니다'; }, function(){ btn.textContent='위 칸을 길게 눌러 복사해 주세요'; });
  }
  function wrapText(ctx, text, max){
    var out=[], line='';
    for(var i=0;i<text.length;i++){ var t=line+text[i]; if(ctx.measureText(t).width>max && line){ out.push(line); line=text[i]; } else line=t; }
    if(line) out.push(line); return out;
  }
  function drawCard(link, orderNo, ud){
    var W=900, H=1240, c=document.createElement('canvas'); c.width=W; c.height=H;
    var x=c.getContext('2d'), F="'Noto Sans KR', sans-serif";
    x.fillStyle='#fff'; x.fillRect(0,0,W,H);
    x.fillStyle='#0F172A'; x.fillRect(0,0,W,150);
    x.fillStyle='#fff'; x.font='800 44px '+F; x.fillText('셀프등기24 서류 이용권',56,95);
    x.fillStyle='#0F172A'; x.font='700 30px '+F; x.fillText('주문번호  '+orderNo,56,220);
    x.fillStyle='#047857'; x.fillText('사용 기한  '+ud+'까지',56,268);
    if(typeof qrcode==='function'){
      var qr=qrcode(0,'M'); qr.addData(link); qr.make();
      var n=qr.getModuleCount(), size=440, cell=Math.floor(size/n), off=(W-cell*n)/2, top=310;
      x.fillStyle='#0F172A';
      for(var r=0;r<n;r++) for(var k=0;k<n;k++) if(qr.isDark(r,k)) x.fillRect(off+k*cell, top+r*cell, cell, cell);
    }
    x.fillStyle='#334155'; x.font='500 22px ui-monospace, Consolas, monospace';
    var y=800; wrapText(x, link, W-112).forEach(function(l){ x.fillText(l,56,y); y+=32; });
    x.font='700 27px '+F; x.fillStyle='#0F172A'; y+=24;
    ['이 링크(또는 QR)를 열면 다시 결제하지 않고 서류를 받습니다.'].forEach(function(t){ wrapText(x,t,W-112).forEach(function(l){ x.fillText(l,56,y); y+=40; }); });
    x.font='500 25px '+F; x.fillStyle='#475569';
    ['휴대폰으로 결제했다면 받은 위임장 파일을 PC의 「위임장 파일로 이어서 하기」에 올려도 결제와 입력 내용이 이어집니다.','이 이미지는 본인만 보관하세요. 링크를 가진 사람은 이 결제로 서류를 받을 수 있습니다.']
      .forEach(function(t){ y+=8; wrapText(x,t,W-112).forEach(function(l){ x.fillText(l,56,y); y+=36; }); });
    return c;
  }
  function saveCard(link, orderNo, ud, mode){
    var go=function(){
      var c=drawCard(link, orderNo, ud);
      c.toBlob(function(b){
        if(!b) return;
        var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='셀프등기24_이용권_'+orderNo+'.png';
        document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
        var k=document.getElementById('kept'); if(k){ k.hidden=false; k.textContent='이용권 카드 이미지를 저장했습니다(사진 또는 다운로드 폴더). 링크를 잃어버려도 이 이미지로 다시 들어올 수 있습니다.'; }
        trk('pass_card',{mode:mode});
      },'image/png');
    };
    (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(go, go);
  }
  function keepPass(link, orderNo, ud){
    var sh=document.getElementById('sh'), cd=document.getElementById('cd');
    if(sh) sh.onclick=function(){
      if(navigator.share){
        navigator.share({ title:'셀프등기24 서류 이용권', text:'다시 결제하지 않고 서류를 받는 링크입니다('+ud+'까지). 본인만 보관하세요.', url:link })
          .then(function(){ trk('pass_share',{mode:'share'}); }, function(){});
      } else { copy(link, sh); trk('pass_share',{mode:'copy'}); }
    };
    if(cd) cd.onclick=function(){ saveCard(link, orderNo, ud, 'button'); };
    var flag='sr_card_'+orderNo, done=false;
    try{ done=localStorage.getItem(flag)==='1'; }catch(e){}
    if(!done){ try{ localStorage.setItem(flag,'1'); }catch(e){} setTimeout(function(){ saveCard(link, orderNo, ud, 'auto'); }, 600); }
  }
  function confirm(tries){
    fetch(PA?'/api/pay/payapp-confirm':'/api/pay/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderNo:orderNo})})
      .then(function(r){return r.json();})
      .then(function(d){
        if(PA && d && d.pending){
          if(waits++<15){ box.className='card'; box.innerHTML='<h1>결제를 확인하고 있습니다</h1><p>네이버페이·카카오페이 결제 결과를 받는 중입니다. 잠시만 기다려 주세요.</p>'; setTimeout(function(){confirm(tries);},2000); return; }
          fail('결제 확인이 늦어지고 있습니다. 1~2분 뒤 이 화면을 새로고침해 주세요.'); return;
        }
        if(!d||!d.ok){ fail((d&&d.msg)||'결제 승인에 실패했습니다.'); return; }
        set(PASS_KEY,{token:d.token,orderNo:d.orderNo,exp:d.exp});
        try{localStorage.removeItem(PENDING_KEY);}catch(e){}
        try{ if(typeof gtag==='function') gtag('event','purchase',{transaction_id:d.orderNo,value:d.amount,currency:'KRW',items:[{item_name:'서류 자동완성',price:d.amount,quantity:1}]}); }catch(e){}
        try{ if(hasOpener) window.opener.postMessage({type:'srpay:paid'},location.origin); }catch(e){}
        var link=location.origin+'/normal_form.html?pass='+encodeURIComponent(d.token);
        var until=new Date(d.exp); var ud=until.getFullYear()+'. '+(until.getMonth()+1)+'. '+until.getDate()+'.';
        box.className='card st-ok';
        box.innerHTML='<h1>결제가 완료되었습니다</h1>'+
          '<p>'+(hasOpener?'원래 화면으로 돌아가 위임장부터 내려받으세요. 신청서는 제세공과금 납부 후 이어서 받습니다. 이 창은 닫으셔도 됩니다.':'아래 버튼으로 돌아가 위임장부터 내려받으세요. 신청서는 제세공과금 납부 후 이어서 받습니다.')+'</p>'+
          '<div class="re"><b>재발급 링크 ('+ud+'까지)</b><input readonly value="'+esc(link)+'" onclick="this.select()" aria-label="재발급 링크">'+
          '<small>신청서까지 받으실 때까지 이 링크로 다시 결제하지 않고 이용하실 수 있습니다. 카카오톡 「나에게 보내기」 등으로 보관해 두세요.<br><b>휴대폰으로 결제하고 PC에서 인쇄하려면</b> 위임장을 내려받은 뒤 그 파일을 PC로 옮겨, PC의 서류 작성 화면에서 「위임장 파일로 이어서 하기」에 올리세요. 결제와 입력 내용이 함께 이어집니다.</small>'+
          '<div class="keep"><button class="btn" id="sh" type="button">'+(navigator.share?'나에게 보내기':'링크 복사')+'</button><button class="btn out" id="cd" type="button">이용권 카드 저장</button></div>'+
          '<p class="kept" id="kept" hidden></p></div>'+
          backBtn(hasOpener?'창 닫고 서류 받으러 가기':'서류 받으러 돌아가기')+
          '<p class="meta" style="margin-top:12px">주문번호 '+esc(d.orderNo)+' · '+Number(d.amount).toLocaleString('ko-KR')+'원</p>';
        keepPass(link, d.orderNo, ud);
      })
      .catch(function(){
        if(tries<2) setTimeout(function(){confirm(tries+1);},1500);
        else fail('결제 확인 중 네트워크 오류가 발생했습니다. 이 화면을 새로고침해 주세요.');
      });
  }
  confirm(0);
})();
</script>
</body>
</html>
