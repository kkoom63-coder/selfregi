<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

<script>
(function(){
  var PASS_KEY='selfregi_pass_v1', PENDING_KEY='selfregi_pay_pending';
  var box=document.getElementById('box');
  var q=new URLSearchParams(location.search);
  function get(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
  function set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  var pending=get(PENDING_KEY)||{};
  var from=(pending.from&&/^\/[\w\-./]*$/.test(pending.from))?pending.from:'/normal_form.html';
  var hasOpener=false; try{hasOpener=!!(window.opener&&window.opener.location.origin===location.origin);}catch(e){}

  function backBtn(label){
    return hasOpener
      ? '<button class="btn" onclick="window.close()">'+label+'</button>'
      : '<a class="btn" href="'+esc(from)+'">'+label+'</a>';
  }
  function fail(msg){
    box.className='card st-err';
    box.innerHTML='<h1>결제가 완료되지 않았습니다</h1><p>'+esc(msg)+'</p><p class="meta">결제 금액이 빠져나갔는데 이 화면이 보인다면 결제 시각과 함께 selfregi999@gmail.com으로 알려 주세요.</p>'+backBtn(hasOpener?'창 닫고 돌아가기':'서류 작성 화면으로 돌아가기');
  }

  if(q.get('cancel')){ fail('결제를 취소하셨습니다. 입력하신 내용은 원래 화면에 그대로 있습니다.'); return; }
  var orderNo=q.get('orderNo')||pending.orderNo;
  if(!orderNo){ fail('주문 정보를 찾지 못했습니다.'); return; }

  /* 페이앱(?pa=1): 결제 완료는 페이앱 서버의 결제통보로 확인한다. 통보가 화면 복귀보다 늦을 수 있어
     「확인 중」(202)이면 2초 간격으로 다시 묻는다(최대 약 30초). */
  var PA = q.get('pa')==='1' || pending.m==='payapp', waits=0;

  /* ── 이용권 보관(2026-10-10) ──
     ① 카카오톡으로 보내기(2026-10-12): 카카오 공유 SDK. 이용자 계정으로 「나와의 채팅」 등에 보낸다.
     ② 다른 앱으로 보내기: 휴대폰 공유창. 공유창이 없는 PC는 링크 복사.
     ③ 이용권 카드: 주문번호·기한·링크·QR을 담은 이미지. 버튼을 눌렀을 때만 저장(2026-10-12 자동 저장 폐지 — 사용자 결정).
     ④ PC 화면 QR: 휴대폰 카메라로 찍으면 휴대폰에서 이어진다.
     링크 끝 #r= 에는 입력 내용(주민등록번호 제외)과 이용권이 담긴다(resume.js toHash). # 뒤는 서버로 가지 않는다.
     카드는 이 브라우저에서 그려 바로 내려받는다(서버 전송 없음). */
  function trk(n,d){ try{ if(typeof gtag==='function') gtag('event',n,d||{}); }catch(e){} }
  function copy(link, btn){
    (navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject())
      .then(function(){ btn.textContent='복사했습니다'; }, function(){ btn.textContent='위 칸을 길게 눌러 복사해 주세요'; });
  }
  function wrapText(ctx, text, max){
    var out=[], line='';
    for(var i=0;i<text.length;i++){ var t=line+text[i]; if(ctx.measureText(t).width>max && line){ out.push(line); line=text[i]; } else line=t; }
    if(line) out.push(line); return out;
  }
  function drawCard(link, short, orderNo, ud){
    var W=900, H=1240, c=document.createElement('canvas'); c.width=W; c.height=H;
    var x=c.getContext('2d'), F="'Noto Sans KR', sans-serif";
    x.fillStyle='#fff'; x.fillRect(0,0,W,H);
    x.fillStyle='#0F172A'; x.fillRect(0,0,W,150);
    x.fillStyle='#fff'; x.font='800 44px '+F; x.fillText('셀프등기24 서류 이용권',56,95);
    x.fillStyle='#0F172A'; x.font='700 30px '+F; x.fillText('주문번호  '+orderNo,56,220);
    x.fillStyle='#047857'; x.fillText('사용 기한  '+ud+'까지',56,268);
    if(typeof qrcode==='function'){
      var qr=qrcode(0,'L'); qr.addData(qrText(link)); qr.make();
      var n=qr.getModuleCount(), size=440, cell=Math.floor(size/n), off=(W-cell*n)/2, top=310;
      x.fillStyle='#0F172A';
      for(var r=0;r<n;r++) for(var k=0;k<n;k++) if(qr.isDark(r,k)) x.fillRect(off+k*cell, top+r*cell, cell, cell);
    }
    x.fillStyle='#334155'; x.font='500 22px ui-monospace, Consolas, monospace';
    var y=800; wrapText(x, short, W-112).forEach(function(l){ x.fillText(l,56,y); y+=32; });
    x.font='700 27px '+F; x.fillStyle='#0F172A'; y+=24;
    ['QR을 휴대폰 카메라로 찍으면 입력 내용과 결제가 함께 이어집니다.'].forEach(function(t){ wrapText(x,t,W-112).forEach(function(l){ x.fillText(l,56,y); y+=40; }); });
    x.font='500 25px '+F; x.fillStyle='#475569';
    ['위 주소(글자)로 들어오면 결제만 이어지니, 입력 내용은 위임장 파일로 불러오세요.','개인정보가 담긴 이미지이므로 반드시 본인만 보관해 주세요. 링크를 가진 사람은 이 결제로 서류를 받을 수 있습니다.']
      .forEach(function(t){ y+=8; wrapText(x,t,W-112).forEach(function(l){ x.fillText(l,56,y); y+=36; }); });
    return c;
  }
  function saveCard(link, short, orderNo, ud, mode){
    var go=function(){
      var c=drawCard(link, short, orderNo, ud);
      c.toBlob(function(b){
        if(!b) return;
        var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='셀프등기24_이용권_'+orderNo+'.png';
        document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
        var k=document.getElementById('kept'); if(k){ k.hidden=false; k.textContent='이용권 카드 이미지를 저장했습니다(사진 또는 다운로드 폴더). 링크를 잃어버려도 이 이미지로 다시 들어올 수 있습니다.'; }
        trk('pass_card',{mode:mode});
      },'image/png');
    };
    (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(go, go);
  }
  /* 카카오톡 공유(2026-10-12): 이용자가 자기 카카오 계정으로 「나와의 채팅」 등에 보낸다. 우리 서버는 메시지를 보지 않는다.
     JavaScript 키는 브라우저 공개용이며, 카카오 앱에 등록한 도메인(www.selfregi24.com)에서만 동작한다. */
  var KAKAO_JS_KEY='149aab0e3b3383d16b0bc851dc927064';
  function kakaoReady(){
    try{ if(!window.Kakao) return false; if(!Kakao.isInitialized()) Kakao.init(KAKAO_JS_KEY); return !!(Kakao.Share&&Kakao.Share.sendDefault); }catch(e){ return false; }
  }
  /* QR(2026-10-25 개선): 재발급 링크가 약 1,500자라 QR이 129×129칸(28형)이 된다. 예전엔 4px로 그린 그림을 220px로
     줄여 한 칸이 1.7px, 여백도 CSS padding 8px뿐이라 휴대폰 카메라가 칸을 구분하지 못했다(zxing 판독 시험: 거리 5단계 중 1단계만 인식).
     ① 화면 화소 기준 정수 배율로 그린다(칸 크기가 고르게) ② 사방 4칸 여백을 그림 안에 넣는다 ③ 칸이 작으면 「크게 보기」. */
  function drawQR(cv, text, cssMax, tight){
    if(!cv||typeof qrcode!=='function') return null;
    try{
      var qr=qrcode(0,'L'); qr.addData(text); qr.make();
      var n=qr.getModuleCount(), dpr=window.devicePixelRatio||1, Q=4, px=Math.floor(cssMax*dpr/(n+8));
      /* tight: 둘레가 밝은 바탕(카드의 옅은 하늘색)이면 여백을 2칸으로 줄여 한 칸을 1px 더 키울 수 있을 때 줄인다 */
      if(tight && Math.floor(cssMax*dpr/(n+4))>px){ Q=2; px=Math.floor(cssMax*dpr/(n+4)); }
      px=Math.max(1,px); var t=n+2*Q, side=t*px, q=cv.getContext('2d');
      cv.width=cv.height=side; cv.style.width=cv.style.height=(side/dpr)+'px';
      q.fillStyle='#fff'; q.fillRect(0,0,side,side); q.fillStyle='#0F172A';
      for(var r=0;r<n;r++) for(var k=0;k<n;k++) if(qr.isDark(r,k)) q.fillRect((k+Q)*px,(r+Q)*px,px,px);
      return { n:n, cssCell:px/dpr };
    }catch(e){ return null; }
  }
  /* QR에 담을 링크: 이용권이 #r= 안(k)에도 들어 있으므로 ?pass=를 빼서 약 140자를 줄인다(칸 수 129 → 117).
     링크 글자(복사·카카오톡)는 그대로 ?pass=를 둔다 — 입력 내용을 못 여는 옛 브라우저에서도 결제는 이어지게. */
  function qrText(link){
    var m=link.match(/#r=([A-Za-z0-9_-]+)$/); if(!m) return link;
    var gift=/[?&]type=gift(&|#|$)/.test(link);
    return location.origin+'/normal_form.html'+(gift?'?type=gift':'')+'#r='+m[1];
  }
  function openBigQR(text){
    var z=document.getElementById('qrz');
    if(!z){
      z=document.createElement('div'); z.id='qrz'; z.className='qrz'; z.setAttribute('role','dialog'); z.setAttribute('aria-modal','true'); z.setAttribute('aria-label','재발급 링크 QR 크게 보기');
      z.innerHTML='<div class="qrz-c"><canvas id="qrz-cv" aria-label="재발급 링크 QR"></canvas><p>휴대폰 카메라를 화면에 가까이 대 주세요</p></div><button type="button" class="qrz-x" id="qrz-x">닫기</button>';
      document.body.appendChild(z);
      var close=function(){ z.hidden=true; document.removeEventListener('keydown',esc1); var b=document.getElementById('qrbig'); if(b) b.focus(); };
      var esc1=function(e){ if(e.key==='Escape') close(); };
      z._open=function(){ z.hidden=false; document.addEventListener('keydown',esc1); document.getElementById('qrz-x').focus(); };
      document.getElementById('qrz-x').onclick=close; z.onclick=function(e){ if(e.target===z) close(); };
    }
    drawQR(document.getElementById('qrz-cv'), text, Math.min(720, window.innerWidth-64, window.innerHeight-160));
    z._open(); trk('pass_qr_big',{});
  }
  /* link: 입력 내용까지 담긴 링크(#r=) · short: 결제만 담긴 링크(이용권 카드 글자용) */
  function keepPass(link, short, orderNo, ud){
    var sh=document.getElementById('sh'), cd=document.getElementById('cd'), kk=document.getElementById('kk');
    var msg='셀프등기24 서류 이용권 ('+ud+'까지)\n이 링크를 열면 입력 내용과 결제가 함께 이어집니다. 개인정보가 담긴 링크이므로 반드시 본인만 보관해 주세요.';
    if(kk){
      if(kakaoReady()) kk.onclick=function(){
        try{ Kakao.Share.sendDefault({ objectType:'text', text:msg, link:{ mobileWebUrl:link, webUrl:link }, buttonTitle:'서류 이어서 받기' }); trk('pass_share',{mode:'kakao'}); }
        catch(e){ copy(link, kk); trk('pass_share',{mode:'kakao_fail'}); }
      };
      else { kk.hidden=true; var kn=document.getElementById('kk-n'); if(kn) kn.hidden=true; }
    }
    if(sh) sh.onclick=function(){
      if(navigator.share){
        navigator.share({ title:'셀프등기24 서류 이용권', text:msg, url:link })
          .then(function(){ trk('pass_share',{mode:'share'}); }, function(){});
      } else { copy(link, sh); trk('pass_share',{mode:'copy'}); }
    };
    if(cd) cd.onclick=function(){ saveCard(link, short, orderNo, ud, 'button'); };
    var qt=qrText(link), qc=document.getElementById('qrc'), qb=document.getElementById('qrbig');
    if(qc && getComputedStyle(qc.parentNode).display!=='none'){
      var d=drawQR(qc, qt, qc.parentNode.clientWidth, true);
      if(d){ trk('pass_qr',{len:qt.length, n:d.n}); if(qb) qb.onclick=function(){ openBigQR(qt); }; }
    }
  }
  /* 결제 직전 서류 작성 화면이 맡겨 둔 입력 내용(주민등록번호 제외)을 링크 끝 #r= 에 담는다. 읽은 뒤 바로 지운다. */
  function withDraft(base, token){
    var dr=get('sr_resume_draft'); try{ localStorage.removeItem('sr_resume_draft'); }catch(e){}
    if(!dr||!dr.p||Date.now()-(dr.at||0)>3*3600*1000||!window.SRResume||!SRResume.toHash) return Promise.resolve(base);
    return SRResume.toHash(dr.p, token).then(function(h){ return base+'#r='+h; }, function(){ return base; });
  }
  function confirm(tries){
    fetch(PA?'/api/pay/payapp-confirm':'/api/pay/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderNo:orderNo,bal:((get('selfregi_hub_v1')||{}).balance||'')})}) /* 잔금일 → 매매 이용권은 잔금일+14일까지(서버가 검증·상한) */
      .then(function(r){return r.json();})
      .then(function(d){
        if(PA && d && d.pending){
          if(waits++<15){ box.className='card'; box.innerHTML='<h1>결제를 확인하고 있습니다</h1><p>네이버페이 결제 결과를 받는 중입니다. 잠시만 기다려 주세요.</p>'; setTimeout(function(){confirm(tries);},2000); return; }
          fail('결제 확인이 늦어지고 있습니다. 1~2분 뒤 이 화면을 새로고침해 주세요.'); return;
        }
        if(!d||!d.ok){ fail((d&&d.msg)||'결제 승인에 실패했습니다.'); return; }
        var GIFT=d.product==='gift';
        if(GIFT&&from==='/normal_form.html')from+='?type=gift'; /* 허브는 한 주소에서 ?type=gift로 증여 모드 — 돌아갈 때 모드를 잃지 않게 */
        set(GIFT?'selfregi_pass_gift_v1':PASS_KEY,{token:d.token,orderNo:d.orderNo,exp:d.exp}); /* 상품별 이용권(pay.js PRODUCTS와 같은 키) */
        try{localStorage.removeItem(PENDING_KEY);}catch(e){}
        try{ if(typeof gtag==='function') gtag('event','purchase',{transaction_id:d.orderNo,value:d.amount,currency:'KRW',items:[{item_name:GIFT?'증여 서류 자동완성':'서류 자동완성',price:d.amount,quantity:1}]}); }catch(e){}
        try{ if(hasOpener) window.opener.postMessage({type:'srpay:paid'},location.origin); }catch(e){}
        var short=location.origin+'/normal_form.html?pass='+encodeURIComponent(d.token)+(GIFT?'&type=gift':'');
        var until=new Date(d.exp); var ud=until.getFullYear()+'. '+(until.getMonth()+1)+'. '+until.getDate()+'.';
        withDraft(short, d.token).then(function(link){
        var full=link!==short;
        box.className='card st-ok';
        box.innerHTML='<h1>결제가 완료되었습니다</h1>'+
          '<p>'+(hasOpener?'원래 화면으로 돌아가 위임장부터 내려받으세요. 신청서는 제세공과금 납부 후 이어서 받습니다. 이 창은 닫으셔도 됩니다.':'아래 버튼으로 돌아가 위임장부터 내려받으세요. 신청서는 제세공과금 납부 후 이어서 받습니다.')+'</p>'+
          '<div class="re"><b>재발급 링크 ('+ud+'까지)</b><input readonly value="'+esc(link)+'" onclick="this.select()" aria-label="재발급 링크">'+
          '<small>'+(full?'이 링크를 열면 <b>입력 내용(주민등록번호 제외)과 결제가 함께 이어집니다.</b> PC에서 인쇄하려면 나에게 보내 두고 PC에서 여세요. <b>입력하신 개인정보가 담긴 링크이므로 반드시 본인만 보관해 주세요.</b>':'신청서까지 받으실 때까지 이 링크로 다시 결제하지 않고 이용하실 수 있습니다. <b>결제 정보가 담긴 링크이므로 반드시 본인만 보관해 주세요.</b>')+'</small>'+
          '<button class="kk" id="kk" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#191919" d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.9 5.3 4.7 6.7l-.9 3.4c-.1.3.3.6.6.4l4-2.6c.5.1 1 .1 1.6.1 5.5 0 10-3.6 10-8S17.5 3 12 3z"/></svg>카카오톡으로 보내기</button>'+
          '<p class="kk-n" id="kk-n">받는 사람에서 「나와의 채팅」을 고르면 나에게 보관됩니다</p>'+
          '<div class="keep"><button class="btn" id="sh" type="button">'+(navigator.share?'다른 앱으로 보내기':'링크 복사')+'</button><button class="btn out" id="cd" type="button">이용권 카드 저장</button></div>'+
          '<p class="kept" id="kept" hidden></p>'+
          '<div class="qr"><canvas id="qrc" aria-label="재발급 링크 QR"></canvas><small>휴대폰 카메라로 찍으면 휴대폰에서 바로 이어집니다 · 입력 내용이 담긴 QR이니 캡처해 다른 사람에게 보내지 마세요</small><button type="button" class="qr-big" id="qrbig">인식이 안 되면 QR 크게 보기</button></div></div>'+
          backBtn(hasOpener?'창 닫고 서류 받으러 가기':'서류 받으러 돌아가기')+
          '<p class="meta" style="margin-top:12px">주문번호 '+esc(d.orderNo)+' · '+Number(d.amount).toLocaleString('ko-KR')+'원</p>';
        keepPass(link, short, d.orderNo, ud);
        });
      })
      .catch(function(){
        if(tries<2) setTimeout(function(){confirm(tries+1);},1500);
        else fail('결제 확인 중 네트워크 오류가 발생했습니다. 이 화면을 새로고침해 주세요.');
      });
  }
  confirm(0);
})();
</script>
</body>
</html>
