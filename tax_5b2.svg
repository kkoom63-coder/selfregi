<text x="196" y="128" font-size="7.8" fill="#777">* 최근 취득 등으로 조회되지 않는 물건은 추가하고, 매도·상속 등으로 취득인의 물건이 아닌 경우 삭제 후 신고합니다.</text>
<rect x="196" y="134" width="566" height="20" fill="#f5f6f9" stroke="#e2e5ec"/><text x="214" y="147" text-anchor="middle" font-size="7.6" font-weight="700" fill="#555">선택</text><text x="262" y="147" text-anchor="middle" font-size="7.6" font-weight="700" fill="#555">유형</text><text x="318" y="147" text-anchor="middle" font-size="7.6" font-weight="700" fill="#555">소유자명</text><text x="392" y="147" text-anchor="middle" font-size="7.6" font-weight="700" fill="#555">소유자 주민번호</text><text x="497" y="147" text-anchor="middle" font-size="7.6" font-weight="700" fill="#555">소재지 주소</text><text x="596" y="147" text-anchor="middle" font-size="7.6" font-weight="700" fill="#555">취득일</text><text x="690" y="147" text-anchor="middle" font-size="7.6" font-weight="700" fill="#555">주택 수 산정 포함여부</text>
<rect x="196" y="154" width="566" height="24" fill="#fff" stroke="#e2e5ec"/><rect x="208" y="160" width="11" height="11" rx="2" fill="#fff" stroke="#9aa3b4"/><text x="490" y="170" text-anchor="middle" font-size="8.5" fill="#aaa">조회 결과가 여기에 나옵니다 — 이번에 사는 집과 기존 보유 주택을 모두 선택합니다</text>
<text x="196" y="204" font-size="10.5" font-weight="700" fill="#2c3550">1세대 소유주택 신고내용 사실확인</text>
<rect x="196" y="212" width="566" height="70" rx="3" fill="#fff" stroke="#dfe3ea"/>
<text x="210" y="234" font-size="8.4" fill="#444">&#8226; 향후 세대별 주택 수 확인 결과 신고내용과 다르거나 일시적 2주택으로 신고했으나 종전 주택을 기한 내에</text>
<text x="218" y="249" font-size="8.4" fill="#444">처분하지 않은 경우 가산세를 포함하여 추가로 취득세가 부과될 수 있음을 확인합니다.</text>
<rect x="686" y="262" width="12" height="12" rx="2" fill="#1d6fd0"/><text x="692" y="271.5" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">&#10003;</text><text x="703" y="272" font-size="9" font-weight="700" fill="#333">동의합니다.</text>
