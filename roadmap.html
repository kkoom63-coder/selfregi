<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="robots" content="noindex">
<link rel="canonical" href="https://www.selfregi24.com/normal_form.html">
<title>셀프등기24</title>
<!-- 로드맵은 2026-10-22 서류 작성 화면(normal_form, 「내 셀프등기」)으로 흡수됐다. 옛 링크(#r1~#r5·?pass=·재발급)는 같은 단계로 넘긴다.
     #r4·#r5(등기소 접수) → ⑦ 접수, 그 밖 → ⑥ 신청서. 이 기기에서 증여로 작성 중이면 증여 화면. 대지지분 서식(?addr=)은 가이드로. -->
<script>
(function(){
  var q=location.search.replace(/^\?/,''),h=location.hash,g=false;
  if(/(^|&)addr=/.test(q)){location.replace('guide.html');return;}
  try{g=(JSON.parse(localStorage.getItem('selfregi_form_v1')||'{}')||{}).dealType==='gift';}catch(e){}
  if(g&&!/(^|&)type=gift(&|$)/.test(q))q=(q?q+'&':'')+'type=gift';
  location.replace('normal_form.html'+(q?'?'+q:'')+(/[#&]r=/.test(h)?h:'#s='+(/^#r[45]/.test(h)?'visit':'app')));
})();
</script>
</head><body><a href="normal_form.html">서류 작성 화면으로 이동</a></body></html>
