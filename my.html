<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<!--HUB:START-->
<title>내 셀프등기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 「내 셀프등기」 허브 시제품 v3(2026-10-19). 서류 작성(normal_form) + 로드맵 + 가이드 화면을 한 화면에.
   레이아웃: 휴대폰 한 단(최대 560px) — 내 집 카드 → 0 등기부(판독·문서 반영 미리보기) → 지금 할 일 → 시점별 3단계(잔금 전 / 잔금 당일 / 접수).
   저장: selfregi_form_v1(읽기) · selfregi_pass(_gift)_v1(읽기) · selfregi_relay_v1(납부 번호) · selfregi_gflow_v1(인지)
   · selfregi_hub_v1(잔금일·체크·등기부 판독 요약·이미 낸 것·완료 표시, 새 키) */
:root{
  --navy:#0F172A;--blue:#0369A1;--blue-h:#075985;
  --text:#020617;--sub:#334155;--sub2:#475569;--muted:#64748B;--border:#E2E8F0;
  --bg:#F8FAFC;--card:#fff;--line:#F1F5F9;
  --info-bg:#E0F2FE;--info-bd:#BAE6FD;--info-tx:#075985;
  --ok:#047857;--ok-bg:#ECFDF5;--ok-bd:#A7F3D0;
  --warn-bg:#FFF7ED;--warn-bd:#FED7AA;--warn-tx:#7C2D12;
  --tip-bg:#FEF9EC;--tip-bd:#F5E3B3;--tip-tx:#854F0B;
  --sky:#7DD3FC;--on-navy:#CBD5E1;--scrim:rgba(15,23,42,.55);
  --radius:12px;--shadow:0 1px 3px rgba(2,6,23,.06);
  --font:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.6;word-break:keep-all;-webkit-text-size-adjust:100%}
a{color:var(--blue)}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.task-b:focus-visible{outline-offset:-3px;border-radius:10px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}

/* 상단 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--card);border-bottom:1px solid var(--border)}
.top-in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:800;font-size:16px;color:var(--navy);text-decoration:none}.logo i{font-style:normal;color:var(--blue)}
.top-a{font-size:13.5px;font-weight:700;color:var(--sub2);text-decoration:none}

/* 내 집 카드 */
.home{margin-top:16px;background:var(--navy);color:#fff;border-radius:16px;padding:18px 18px 16px}
.home-eb{font-size:12.5px;font-weight:700;color:var(--sky);letter-spacing:.02em}
.home-addr{font-size:19px;font-weight:800;line-height:1.4;margin-top:4px}
.home-addr.empty{font-size:16px;font-weight:700;color:var(--on-navy)}
.home-sub{font-size:13px;color:var(--on-navy);margin-top:2px}
.home-date{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.14)}
.home-date label{font-size:13px;color:var(--on-navy)}
.home-date input{font:inherit;font-size:14px;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:6px 8px;color-scheme:dark}
.dday{font-size:13.5px;font-weight:700;color:#fff;margin-top:8px}
.dday small{display:block;font-size:12.5px;font-weight:400;color:var(--on-navy)}
.bar{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:14px}
.bar span{height:5px;border-radius:999px;background:rgba(255,255,255,.18)}
.bar span.on{background:var(--sky)}.bar span.done{background:#fff}
.bar-l{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px;font-size:12px;color:var(--on-navy)}
.bar-l b{color:#fff;font-weight:700}

/* 0 등기부 — 서류 작성 페이지 「0 등기부로 자동 채우기」와 같은 모양 */
.ocr{margin-top:12px;background:linear-gradient(#F0F9FF,var(--card) 140px);border:1.5px solid var(--sky);border-radius:var(--radius);padding:16px 14px;box-shadow:var(--shadow)}
.ch{display:grid;grid-template-columns:32px minmax(0,1fr) auto;column-gap:10px;row-gap:2px;align-items:start;margin-bottom:12px}
.ci{width:32px;height:32px;border-radius:8px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.ci.ok{background:var(--ok)}
.ct{font-size:15.5px;font-weight:700;color:var(--navy);line-height:32px}
.ch-a{align-self:center;font-size:13px;font-weight:700;color:var(--blue);background:none;border:0;padding:0}
.hero-note{background:var(--info-bg);border:1px solid var(--info-bd);color:var(--info-tx);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:0 0 12px}
.hero-note b{font-weight:700}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1.5px dashed var(--blue);border-radius:10px;background:#F0F9FF;padding:18px 14px}
.drop.over{background:var(--info-bg)}
.dz-ic{width:34px;height:40px;margin-bottom:10px}
.slot-t{font-size:16px;font-weight:800;color:var(--navy);margin-bottom:6px;letter-spacing:-.3px}
.drop .sub{font-size:12.5px;color:var(--muted);line-height:1.7}
.fb{display:inline-block;margin-top:13px;height:42px;line-height:42px;padding:0 22px;font-size:14px;font-weight:700;color:#fff;background:var(--blue);border:0;border-radius:8px;cursor:pointer}
.fb:hover{background:var(--blue-h)}
.pr{align-self:stretch;height:5px;background:var(--border);border-radius:3px;margin-top:14px;overflow:hidden}
.pr i{display:block;height:100%;width:0;background:var(--blue);transition:width .4s ease}
.say{align-self:stretch;font-size:12.5px;color:var(--sub2);margin-top:8px}
.say:empty{display:none}
.reg-how{margin:12px 0 0;font-size:13px;color:var(--sub2)}
.ocr-docs{margin:10px 0 0;font-size:12.5px;color:var(--sub2)}
.ocr-docs b{color:var(--navy);font-weight:600}
.iros{display:inline-flex;align-items:center;height:28px;margin-top:6px;padding:0 10px;border-radius:6px;background:var(--sub2);color:#fff;font-size:12px;font-weight:600;text-decoration:none}
.iros:hover{background:var(--sub)}
.court{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--border);border-radius:10px;background:var(--card);padding:9px 12px;margin-bottom:8px;font-size:13.5px}
.court-k{color:var(--sub2);flex:none}
.court-n{flex:1;min-width:0;font-weight:700;color:var(--navy)}
.court-a{font-size:12.5px;color:var(--muted)}
.court-m{flex:none;font-size:13px;font-weight:700;color:var(--blue);text-decoration:none}
.ocr-all{display:inline-block;margin-top:12px;font-size:13.5px;font-weight:700;color:var(--blue);background:none;border:0;padding:0}
.ocr-err{background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn-tx);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px}
.ocr-err .btn{margin-top:8px}

/* 문서 반영 미리보기(서류 작성 페이지 오른쪽 패널과 같은 내용) */
.sum{font-size:13.5px;color:var(--sub);margin:0 0 10px}
.sum b{color:var(--navy)}
.lv{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;margin-right:6px;background:var(--ok-bg);color:var(--ok)}
.lv.oc{background:var(--warn-bg);color:var(--warn-tx)}
.pv{border:1px solid var(--border);border-radius:10px;background:var(--card);padding:12px;margin-bottom:8px}
.pv-h{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.pv-r{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px;padding:5px 0;font-size:13.5px;border-top:1px solid var(--line)}
.pv-r:first-of-type{border-top:0}
.pv-k{color:var(--sub2)}
.pv-v{color:var(--navy);font-weight:500;overflow-wrap:anywhere}
.pv-v.miss{color:var(--muted);font-weight:400}
.pv-v.miss::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#EA580C;margin:0 6px 2px 0}
.pv-in{font:inherit;font-size:14px;padding:3px 6px;border:1px solid var(--border);border-radius:6px;color:var(--text);background:var(--card)}
.pv-s{font-size:12px;color:var(--muted)}
.pv-x{border:0;background:none;padding:0;margin-left:6px;font-size:12.5px;font-weight:700;color:var(--blue)}
.pay-p{display:flex;align-items:baseline;gap:8px;margin:0 0 2px}
.pay-p b{font-size:22px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.pay-p span{font-size:13px;color:var(--muted)}
.panel .pay-d{font-size:13px;color:var(--sub2);margin:0 0 10px}
.svc{margin-top:10px;border:1px solid var(--border);border-radius:10px;padding:0 12px}
.svc summary{cursor:pointer;padding:10px 0;font-size:13px;font-weight:700;color:var(--sub)}
.svc dl{display:grid;grid-template-columns:64px minmax(0,1fr);gap:6px 10px;margin:0 0 10px;font-size:12.5px;color:var(--sub)}
.svc dt{font-weight:700;color:var(--navy)}.svc dd{margin:0}
.svc .sm{margin:0 0 10px}
.pv-r.low{background:var(--warn-bg);margin:0 -12px;padding:5px 12px}
.pv-low{font-style:normal;font-size:11.5px;font-weight:700;color:var(--warn-tx);background:var(--card);border:1px solid var(--warn-bd);border-radius:999px;padding:0 6px}
.pv-wide{width:100%;max-width:220px}
.pv-r.full{grid-template-columns:minmax(0,1fr);gap:4px}
.pv-f{display:grid;grid-template-columns:52px minmax(0,1fr);gap:6px;align-items:center;margin-bottom:6px}
.pv-f label{font-size:12.5px;color:var(--sub2)}
.pv-f .pv-in{width:100%}
.pv-warn{background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn-tx);border-radius:10px;padding:8px 12px;font-size:13px;margin:0 0 8px}
.pv-cnt{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px;color:var(--sub2);margin:10px 2px 0}
.pv-cnt b{font-variant-numeric:tabular-nums;text-align:right}
.pv-cnt .g{color:var(--ok)}.pv-cnt .o{color:#C2410C}
.ocr-next{margin-top:12px}

/* 지금 할 일 */
.now{margin-top:12px;background:var(--card);border:1.5px solid var(--blue);border-radius:16px;padding:16px 16px 14px;box-shadow:var(--shadow)}
.now-eb{font-size:12.5px;font-weight:700;color:var(--blue)}
.now-t{font-size:18px;font-weight:800;color:var(--navy);margin:2px 0 0;line-height:1.4}
.now-d{font-size:13.5px;color:var(--sub2);margin:4px 0 0}
.now .btn{margin-top:12px}
.now.wait{border-color:var(--border)}.now.wait .now-eb{color:var(--muted)}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:13px 14px;font-size:15px;font-weight:700;text-align:center;text-decoration:none;background:var(--blue);color:#fff}
.btn:hover{background:var(--blue-h)}
.btn.line{background:var(--card);color:var(--sub);border:1px solid var(--border)}
.btn.line:hover{background:var(--line)}

/* 시점별 단계 */
.ph{margin-top:26px}
.ph-h{display:grid;grid-template-columns:32px minmax(0,1fr);column-gap:10px;align-items:center;padding:0 2px 10px}
.ph-n{width:32px;height:32px;border-radius:8px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.ph-t{font-size:15.5px;font-weight:800;color:var(--navy);margin:0;line-height:1.3}
.ph-w{display:block;font-size:12.5px;font-weight:400;color:var(--muted)}
.list{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.task-b{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:13px 14px;text-align:left;color:inherit}
.dot{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff}
.task.done .dot{background:var(--ok);border-color:var(--ok)}
.task.paid .dot{border-color:var(--ok);background:var(--card);color:var(--ok)}
.task.now .dot{border-color:var(--blue);box-shadow:inset 0 0 0 4px var(--card);background:var(--blue)}
.task-tx{flex:1;min-width:0}
.task-t{display:block;font-size:14.5px;font-weight:700;color:var(--navy)}
.task.done .task-t{color:var(--sub2)}
.task-n{display:block;font-size:12.5px;color:var(--muted);margin-top:1px;overflow-wrap:anywhere}
.task.now .task-n{color:var(--blue);font-weight:700}
.pill{flex:none;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.now{background:var(--info-bg);color:var(--info-tx)}
.chev{flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 2px 0 0;transition:transform .15s}
.task.open .chev{transform:rotate(-135deg);margin-top:4px}
.panel{padding:2px 14px 16px 50px}
.panel p{margin:0 0 10px;font-size:13.5px;color:var(--sub)}
.panel .btn{font-size:14px;padding:11px 12px}
.panel .btn+.btn{margin-top:8px}
p.sm,.sm{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:4px}
.fld label small{font-weight:400;color:var(--muted);margin-left:6px}
.fld input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-variant-numeric:tabular-nums}
.link{display:inline-block;margin-top:10px;font-size:13.5px;font-weight:700;color:var(--blue);background:none;border:0;padding:0;text-decoration:none}
.ck-g{margin:0 0 12px}
.ck-g h4{margin:0 0 6px;font-size:13px;color:var(--sub2)}
.ck{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;margin:0 -8px;border-radius:8px;font-size:13.5px;color:var(--sub);cursor:pointer}
.ck input{flex:none;width:18px;height:18px;margin:2px 0 0;accent-color:var(--ok)}
.ck small{display:block;font-size:12.5px;color:var(--muted)}
.ck.on{background:var(--ok-bg)}
.ck.on>span{color:var(--navy)}
.rs{list-style:none;margin:0 0 12px;padding:0}
.rs li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;padding:7px 0;font-size:13.5px;color:var(--sub);border-top:1px solid var(--line)}
.rs li:first-child{border-top:0}
.rs i{font-style:normal;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;align-self:start;margin-top:1px;white-space:nowrap}
.rs i.ok{background:var(--ok-bg);color:var(--ok)}.rs i.no{background:var(--warn-bg);color:var(--warn-tx)}.rs i.ck2{background:var(--line);color:var(--sub2)}
.rs small{display:block;font-size:12.5px;color:var(--muted)}
.warn{background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn-tx);border-radius:10px;padding:10px 12px;font-size:13px;margin:0 0 10px}
.tip{background:var(--tip-bg);border:1px solid var(--tip-bd);color:var(--tip-tx);border-radius:8px;padding:9px 11px;font-size:12.5px;margin:0 0 10px}
.panel .tip{margin-top:4px}

/* 이미 낸 것 고르기 — 가이드를 보고 온 사람 / 처음 해 보는 사람 */
.ask{padding:14px}
.ask-q{font-size:14.5px;font-weight:700;color:var(--navy);margin:0}
.ask-d{font-size:12.5px;color:var(--muted);margin:2px 0 10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{width:100%;text-align:left;background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:700;color:var(--navy)}
.tile small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.tile[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.tile.wide{grid-column:1/-1}
.ask .btn{margin-top:10px;font-size:14px;padding:11px 12px}
.ask .link{margin-top:6px}

.disc{margin-top:22px;font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:300;background:var(--navy);color:#fff;font-size:13.5px;padding:9px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}

/* 화면 가이드 — guide.html 팝업과 같은 자료(guide_shots.js), 이 화면 안에서 연다 */
.gm{position:fixed;inset:0;z-index:200;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.gm[hidden]{display:none}
.gm-in{width:100%;max-width:560px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));background:var(--card);border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden}
.gm-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 10px;border-bottom:1px solid var(--border)}
.gm-ht{font-size:14px;font-weight:700;color:var(--navy);min-width:0}
.gm-ht small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.gm-x{flex:none;border:1px solid var(--border);background:var(--card);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--sub)}
.gm-b{overflow:auto;padding:12px 16px}
.gm-img{position:relative;background:var(--line);border:1px solid var(--border);border-radius:10px;overflow:hidden;min-height:160px;display:flex;align-items:center;justify-content:center}
.gm-img img{display:block;width:100%;height:auto}
.gm-badge{position:absolute;right:8px;top:8px;font-size:11px;font-weight:700;color:var(--sub);background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:999px;padding:1px 8px}
.gm-t{font-size:15px;font-weight:800;color:var(--navy);margin:12px 0 4px}
.gm-d{font-size:13.5px;color:var(--sub);margin:0 0 10px}
.gm-dots{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:4px 0 2px}
.gm-dots button{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--border)}
.gm-dots button.on{background:var(--blue);width:18px;border-radius:999px}
.gm-f{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border)}
.gm-f .btn{font-size:14px;padding:12px}
.gm-f .btn:disabled{opacity:.45;cursor:default}

/* 시제품 전용 — 예시 상태 전환 */
.demo{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--card);border-top:1px solid var(--border);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(8px + env(safe-area-inset-bottom,0px))}

(function(){

/* ---------- 저장값 ---------- */
var K={form:'selfregi_form_v1',pass:'selfregi_pass_v1',passG:'selfregi_pass_gift_v1',relay:'selfregi_relay_v1',relayTs:'selfregi_relay_ts_v1',flow:'selfregi_gflow_v1',hub:'selfregi_hub_v1'};
function rd(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function has(v){return v!=null&&String(v).trim()!=='';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function digits(v){return String(v||'').replace(/[^\d]/g,'');}
function won(v){var n=Number(digits(v));return n?n.toLocaleString('ko-KR')+'원':'';}
function track(n,d){try{window.SR&&SR.track(n,d);}catch(e){}}
function clone(o){return JSON.parse(JSON.stringify(o));}

/* selfregi_form_v1 30일 만료 — 서류 작성 화면·로드맵의 pruneForm과 같은 규칙(ts 없는 구버전은 지금 찍어 살린다) */
(function(){var f=rd(K.form);if(!f||typeof f!=='object')return;
  if(!f.ts){f.ts=Date.now();wr(K.form,f);return;}
  if(Date.now()-Number(f.ts)>30*24*3600*1000){try{localStorage.removeItem(K.form);}catch(e){}}})();
function realState(){
  var pass=[rd(K.pass),rd(K.passG)].some(function(p){return p&&p.token&&p.exp>Date.now();});
  var flow=rd(K.flow)||{};
  return {form:rd(K.form),pass:pass,relay:rd(K.relay)||{},fin:flow.fin||{},hub:rd(K.hub)||{}};
}

/* 시제품 예시 상태 — 화면 판단용. 저장소에는 쓰지 않는다. 값은 모두 지어낸 예시 */
function dAdd(n){var d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
var EX_REG={addr:'서울특별시 마포구 아현동 777',apt:'예시아파트',dong:'101',floor:'12',ho:'1203',struct:'철근콘크리트구조',area:'84.97',
  land:'38520.6분의 41.27',uid:'1101-2010-000000',owners:[{name:'김매도',share:'',regAddr:'서울특별시 마포구 예시로 1'}],
  liens:[{purpose:'근저당권설정',amount:'360,000,000',creditor:'예시은행'}],blockers:[],isTrust:false,sepReg:false,ocr:false,got:8,low:{land:1}};
var EX_FORM={buyerName:'이매수'};
var DEMOS=[
  {k:'real',t:'이 기기 저장값'},
  {k:'first',t:'처음 온 사람',s:{form:null,pass:false,relay:{},fin:{},hub:{}}},
  {k:'info',t:'등기부 올림 · 잔금 D-9',s:{form:null,pass:false,relay:{},fin:{},hub:{reg:EX_REG,balance:dAdd(9),checks:{d1:1,d2:1,d3:1}}}},
  {k:'d1',t:'채권·수수료 냄 · 잔금 D-1',s:{form:EX_FORM,pass:false,relay:{bondamt:'3456000',bond:'2610-1234-5678',fee:'14-00-12-3456789'},fin:{},hub:{reg:EX_REG,balance:dAdd(1),pre:{bond:1,efee:1},asked:1,checks:{d1:1,d2:1,d3:1,d4:1,d5:1,d6:1,d7:1,q1:1}}}},
  {k:'day',t:'잔금 당일',s:{form:EX_FORM,pass:true,relay:{bondamt:'3456000',bond:'2610-1234-5678',fee:'14-00-12-3456789'},fin:{stamp:true},hub:{reg:EX_REG,balance:dAdd(0),asked:1,checks:{d1:1,d2:1,d3:1,d4:1,d5:1,d6:1,d7:1,q1:1,q2:1}}}},
  {k:'ready',t:'납부 끝 · 접수 전',s:{form:EX_FORM,pass:true,relay:{tax:'12000000',edu:'1200000',siga:'1080000000',bondamt:'3456000',bond:'2610-1234-5678',fee:'14-00-12-3456789'},fin:{stamp:true},hub:{reg:EX_REG,balance:dAdd(-2),asked:1,checks:{d1:1,d2:1,d3:1,d4:1,d5:1,d6:1,d7:1,q1:1,q2:1,s1:1,s2:1,s3:1},apply:true}}}
];
var mode='real',S=realState();
function demoOn(){return mode!=='real';}
function saveHub(){if(demoOn())return;wr(K.hub,S.hub);syncForm();}
function saveRelay(vals){
  Object.keys(vals).forEach(function(k){S.relay[k]=vals[k];});
  if(demoOn())return;
  var r=rd(K.relay)||{};Object.keys(vals).forEach(function(k){r[k]=vals[k];}); /* 다른 키는 지우지 않는다 */
  wr(K.relay,r);try{localStorage.setItem(K.relayTs,String(Date.now()));}catch(e){}
}
function saveFin(key){
  S.fin[key]=true;if(demoOn())return;
  var fl=rd(K.flow)||{};fl.fin=fl.fin||{};fl.fin[key]=true;fl.pre=fl.pre||{};wr(K.flow,fl);

/* ---------- 날짜 ---------- */
function today(){var d=new Date();d.setHours(0,0,0,0);return d;}
function daysTo(iso){if(!iso)return null;var p=iso.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);return Math.round((d-today())/864e5);}
function md(iso){var p=iso.split('-');return (+p[1])+'월 '+(+p[2])+'일';}
function when(){var n=daysTo(S.hub.balance);if(n==null)return 'none';return n>0?'before':(n===0?'day':'after');}

/* ---------- 등기부 판독 요약(서류 작성 페이지 buildRows와 같은 규칙) ---------- */
function splitJibun(j){var o={addr:j||'',apt:'',dong:''};if(!j)return o;
  var m=j.match(/^(.*?)\s*([가-힣A-Za-z0-9·\.]+)\s*제\s*([0-9가-힣]+)\s*동\s*$/);if(m)return {addr:m[1].trim(),apt:m[2].trim(),dong:m[3]};
  m=j.match(/^(.*?\d+(?:-\d+)?)\s+(.+)$/);if(m){o.addr=m[1].trim();o.apt=m[2].trim();}return o;}
function splitExcl(e){var m=String(e||'').match(/제\s*(\d+)\s*층\s*제\s*([0-9가-힣]+)\s*호/);return m?{floor:m[1],ho:m[2]}:{floor:'',ho:''};}
function summarize(res){
  var P=res.property||{},jb=splitJibun(P.jibunAddress),ex=splitExcl(P.exclusiveNo),r=P.landRightRatio;
  var g={addr:jb.addr,apt:jb.apt,dong:jb.dong,floor:ex.floor,ho:ex.ho,
    struct:String(P.exclusiveStruct||'').replace(/[\d.,]+\s*(?:㎡|m2|m²).*$/,'').trim(),area:P.exclusiveArea||'',
    land:r?(r.denom+'분의 '+r.num):'',uid:res.uid||'',
    owners:(res.owners||[]).map(function(o){var sh=o.share&&!o.share.sole?o.share:{};return {name:o.name||'',share:o.shareRaw||'',sd:sh.denom?String(sh.denom):'',sn:sh.num?String(sh.num):'',regAddr:o.registryAddress||''};}),
    liens:(res.activeLiens||[]).map(function(L){return {purpose:L.purpose||'',amount:L.maxAmount||'',creditor:L.creditor||''};}),
    blockers:(res.blockers||[]).map(function(b){return b.purpose;}),isTrust:!!res.isTrust,
    sepReg:!!(P.separateReg&&P.separateReg.value),ocr:!!res._ocr};
  var CF=res.confidence||{},LOW={jibunAddress:'addr',exclusiveNo:'addr',exclusiveArea:'area',landRightRatio:'land',owners:'seller'};
  g.low={};Object.keys(LOW).forEach(function(k){if(CF[k]==='low')g.low[LOW[k]]=1;});
  if((res._confirm||[]).length)g.low.addr=1;
  g.got=['addr','floor','ho','struct','area','land','uid'].filter(function(k){return has(g[k]);}).length+(g.owners.length&&has(g.owners[0].name)?1:0);
  return g;
}

/* ---------- 준비 서류 ---------- */
var DOCS=[
  {g:'계약 때 받은 서류',items:[
    {id:'d1',t:'매매계약서 원본',s:'취득세 신고와 등기 신청에 모두 필요'},
    {id:'d2',t:'부동산거래계약 신고필증',s:'통상 중개사가 신고 후 교부'},
    {id:'d3',t:'등기사항전부증명서(등기부등본)',s:'잔금일 기준 최신본'}]},
  {g:'매수인 준비서류',items:[
    {id:'d4',t:'주민등록등본',s:'주민번호 뒷자리 포함으로 발급(별표로 가리면 보정 요구가 많음)'},
    {id:'d5',t:'토지대장 · 건축물대장(집합·전유부)',s:'정부24 무료 발급'},
    {id:'d6',t:'가족관계증명서',s:'취득세 신고용 — 등기 신청 때는 제출하지 않음'},
    {id:'d7',t:'신분증 · 도장',s:'등기소 가는 날'}]}
];
var DOC_ITEMS=DOCS[0].items.concat(DOCS[1].items);
/* 위임장에 들어갈 매도인 주소(초본)와 인감증명서의 매수인 인적사항은 위임장 결제 전에 맞춰 둔다 */
var REQ=[
  {id:'q1',t:'매도인 주민등록초본 미리 받기',s:'위임장에 들어갈 매도인 현재 주소 · 등기부 주소와 다르면 이어지는 이력까지'},
  {id:'q2',t:'매수인 인적사항을 매도인에게 전달',s:'매도용 인감증명서에 적힐 이름·주소·주민번호 — 틀리면 각하 · 공동명의면 전원'}
];
var SELLER=[
  {id:'s1',t:'등기필정보(구 등기필증·등기권리증) 원본',s:'사본·사진은 안 됩니다'},
  {id:'s2',t:'부동산 매도용 인감증명서 원본',s:'미리 전달한 매수인 인적사항과 같은지 확인'},
  {id:'s3',t:'위임장에 매도인 인감 날인',s:'인감증명서와 같은 도장 · 2장 이상이면 간인'}
];
function cnt(list){var c=S.hub.checks||{};return list.filter(function(x){return c[x.id];}).length;}

/* ---------- 반려 최종 점검(reject.html 26개 중 단독 매매에 자주 걸리는 것) — 맨 아래 한 곳에만 ---------- */
var RJ=[
  {t:'등기원인일자는 매매계약 체결일',s:'잔금일과 혼동하기 쉽습니다'},
  {t:'초본·등본에 주민번호 뒷자리가 보이게 발급',s:'별표로 가린 서류는 보정 요구가 많습니다'},
  {t:'거래가액이 계약서·신고필증·신청서에서 모두 같게',s:''},
  {t:'첨부서류는 발행일부터 3개월 이내',s:''}
];
/* 올린 등기부를 읽어 나온 결과 — 문제 없음도 그대로 보여준다(점검했다는 사실이 정보다) */
function regScan(){
  var g=S.hub.reg;
  if(!g)return '<div class="ck-g"><h4>등기부 점검</h4><p class="sm" style="margin:0">맨 위 0번에 등기부를 올리면 근저당·압류·신탁을 자동으로 점검합니다.</p></div>';
  var li=[];
  function row(ok,label,t,sub){li.push('<li><i class="'+(ok?'ok':'no')+'">'+label+'</i><span>'+t+(sub?'<small>'+esc(sub)+'</small>':'')+'</span></li>');}
  row(!g.liens.length,g.liens.length?'확인 필요':'없음','근저당권'+(g.liens.length?' '+g.liens.length+'건 — 잔금일 상환·말소 서류를 받기로 했는지':''),g.liens.map(function(L){return (L.creditor||L.purpose)+(L.amount?' · 채권최고액 '+L.amount+'원':'');}).join(' / '));
  row(!g.blockers.length,g.blockers.length?'확인 필요':'없음','압류·가압류·가처분'+(g.blockers.length?' — '+esc(g.blockers.join('·')):''),'');
  row(!g.isTrust,g.isTrust?'확인 필요':'아님','신탁(현재 소유자가 수탁자)','');
  if(g.sepReg)row(false,'확인 필요','표제부 「별도등기 있음」','');
  g.owners.forEach(function(o){if(o.regAddr)row(false,'대조','매도인 등기부 주소 — 초본의 현재 주소와 이어지는지',o.regAddr);});
  return '<div class="ck-g"><h4>등기부 자동 점검</h4><ul class="rs">'+li.join('')+'</ul></div>';
}

/* ---------- 할 일 ---------- */
function f(k){return has(S.relay[k]);}
function pre(k){return !!(S.hub.pre&&S.hub.pre[k]);}
function reg(){return S.hub.reg||null;}
function ed(k){var E=S.hub.edit||{};return has(E[k])?E[k]:'';}
/* 부동산 값 — 허브에서 고친 값 > 올린 등기부 > 서류 작성 화면에서 저장된 값(selfregi_form_v1) */
function frac(s){var m=String(s||'').match(/([\d.,]+)\s*분의\s*([\d.,]+)/);return m?{d:m[1].replace(/,/g,''),n:m[2].replace(/,/g,'')}:null;}
function prop(){
  var g=reg()||{},x=S.form||{},E=S.hub.edit||{};
  function pick(ek,gv,xk){return has(E[ek])?String(E[ek]).trim():(has(gv)?String(gv).trim():(has(x[xk])?String(x[xk]).trim():''));}
  var lr=frac(E.land)||frac(g.land)||(has(x.total)&&has(x.unit)?{d:x.total,n:x.unit}:null);
  return {jibun:pick('jibun',g.addr,'jibun'),apt:pick('apt',g.apt,'aptName'),dong:pick('dong',g.dong,'dong'),floor:pick('floor',g.floor,'floor'),ho:pick('ho',g.ho,'ho'),
    struct:pick('struct',g.struct,'propStruct'),area:pick('area',g.area,'propArea').replace(/\s*(㎡|m2|m²)$/,''),total:lr?lr.d:'',unit:lr?lr.n:'',uid:pick('uid',g.uid,'propertyUid')};
}
function addr(){var p=prop();if(!has(p.jibun))return '';
  return p.jibun+(has(p.apt)?' '+p.apt:'')+(has(p.ho)?' '+(has(p.dong)?p.dong+'동 ':'')+p.ho+'호':'');}
/* 매도인·매수인 — 처음에는 서류 작성 화면 값(공동명의 포함)이나 등기부 소유자로 채우고, 그 뒤로는 허브 값(hub.party)이 기준.
   주민등록번호는 hub에 두지 않는다 — selfregi_form_v1(30일 만료)에만 둔다(서류 작성 화면과 같은 규칙) */
function partyInit(){
  if(S.hub.party)return S.hub.party;
  var x=S.form||{},g=reg();
  function cp(a){return (a||[]).map(function(p){return {name:p.name||'',addr:p.addr||'',sd:p.shareDenom||'',sn:p.shareNum||''};});}
  var s=x.sellerJoint&&x.sellers&&x.sellers.length>1?cp(x.sellers):(has(x.sellerName)?[{name:x.sellerName,addr:x.sellerAddr||'',sd:'',sn:''}]:[]);
  if(!s.some(function(p){return has(p.name);})&&g&&g.owners.length)s=g.owners.slice(0,2).map(function(o){return {name:o.name,addr:'',sd:g.owners.length>1?o.sd:'',sn:g.owners.length>1?o.sn:''};});
  var b=x.buyerJoint&&x.buyers&&x.buyers.length>1?cp(x.buyers):(has(x.buyerName)?[{name:x.buyerName,addr:x.buyerAddr||'',sd:'',sn:''}]:[]);
  if(!s.length&&!b.length)return null;
  S.hub.party={s:s.length?s:[{name:'',addr:'',sd:'',sn:''}],b:b.length?b:[{name:'',addr:'',sd:'',sn:''}],agent:+x.agentIdx||0};
  return S.hub.party;
}
function party(){return partyInit()||{s:[{name:'',addr:'',sd:'',sn:''}],b:[{name:'',addr:'',sd:'',sn:''}],agent:0};}
function rrnOf(i){var x=S.form||{},a=x.buyers||[];if(a[i]&&has(a[i].rrn))return a[i].rrn;return i===0&&has(x.buyerRrn)?x.buyerRrn:'';}
function sellerName(){return party().s.map(function(p){return p.name;}).filter(has).join(', ');}
function buyerName(){return party().b.map(function(p){return p.name;}).filter(has).join(', ');}
function shareTxt(){var v=ed('share')||(S.form&&S.form.transferShare)||'전부';return v;}

/* 허브 값 → selfregi_form_v1(서류 작성 화면 relayForm과 같은 스키마 v3). 로드맵 신청서와 허브 다운로드가 이 값을 쓴다.
   기존 값에서 시작해 덮어쓰므로 허브에 없는 칸(부동산 종류·도로명주소 등)과 주민등록번호는 그대로 남는다 */
function hubForm(){
  var x=S.form||{},p=prop(),P=party(),E=S.hub.edit||{};
  function pp(q,i,buyer){var o={name:q.name||'',addr:q.addr||'',rrn:buyer?rrnOf(i):''};if(has(q.sd)&&has(q.sn)){o.shareDenom=q.sd;o.shareNum=q.sn;}return o;}
  var b=P.b.map(function(q,i){return pp(q,i,1);}),s=P.s.map(function(q){return pp(q);});

/* ---------- 공시가격 → 채권 매입액(계산기와 같은 요율·반올림) ---------- */
var BT=[[2e7,13,13],[5e7,19,14],[1e8,21,16],[1.6e8,23,18],[2.6e8,26,21],[6e8,31,26]];
function bondOf(v,parcel){var metro=/특별시|광역시/.test(parcel)&&!/특별자치/.test(parcel),r=0;BT.forEach(function(t){if(v>=t[0])r=metro?t[1]:t[2];});
  if(!r)return {r:0,amt:0};var x=v*r/1000,m=Math.floor(x/10000);return {r:r,amt:Math.max((m+(x-m*10000>=5000?1:0))*10000,10000)};}
function sigaGo(){
  var g=reg();if(!g)return;var msg=document.getElementById('sigaMsg');if(msg)msg.textContent='공시가격 조회 중…';
  var done=function(o){if(!o||!o.v){OCR.siga='공시가격을 찾지 못했습니다. 은행 화면에서 조회해 주세요.';render();return;}
    var b=bondOf(Number(o.v),o.parcel||g.addr);
    OCR.siga=o.y+'년 공시가격 '+won(o.v)+' · 채권 매입액 '+won(b.amt)+'('+b.r+'/1,000). 은행 화면에서 공시가격을 다시 조회하지 않고 이 금액을 그대로 쓰면 됩니다.';
    S.relay.bondamt=String(b.amt);render();track('hub_siga',{});};
  if(demoOn())return done({v:1080000000,y:2026,parcel:g.addr});
  if(!window.SRSiga){OCR.siga='공시가격 조회를 불러오지 못했습니다.';render();return;}
  SRSiga.lookup(g.addr,g.dong,g.ho).then(function(o){if(o&&o.err==='limit'){OCR.siga='오늘 조회 한도를 넘었습니다. 내일 다시 시도해 주세요.';render();return;}done(o);},function(){done(null);});
}

/* ---------- 등기부 판독(서류 작성 페이지와 같은 RegParse — PDF 원본은 글자를 그대로 읽는다) ---------- */
function readBuf(fl){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){ok(r.result);};r.onerror=function(){no(new Error('파일을 읽지 못했습니다.'));};r.readAsArrayBuffer(fl);});}
function setOcr(o){Object.keys(o).forEach(function(k){OCR[k]=o[k];});render();}
function isPdf(fl){return /pdf/i.test(fl.type)||/\.pdf$/i.test(fl.name);}
var PHOTO_MSG='<b>사진·스캔 PDF는 서류 작성 화면에서 읽습니다.</b> 이 시제품은 인터넷등기소 PDF 원본만 바로 읽습니다.<a class="btn line" href="normal_form.html" data-handoff="1">서류 작성 화면에서 읽기</a>';
function readReg(files){
  var list=[].slice.call(files||[]);if(!list.length)return;
  OCR.files=list;var pdf=list.filter(isPdf)[0];
  track('hub_ocr',{type:pdf?'pdf':'image'});
  if(!pdf){setOcr({err:PHOTO_MSG,say:''});return;}
  if(!window.pdfjsLib||!window.RegParse){setOcr({err:'판독 모듈을 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.',say:''});return;}
  setOcr({busy:true,err:'',pct:.15,say:'발급 원본을 여는 중…'});
  readBuf(pdf).then(function(buf){return RegParse.parseRegistry(pdfjsLib,buf);}).then(function(res){
    if(!res||!res.ok){
      if(res&&res.reason==='NO_TEXT_LAYER'){setOcr({busy:false,err:PHOTO_MSG,say:''});return;}
      throw new Error(res&&res.reason==='NOT_REGISTRY'?'등기사항전부증명서로 보이지 않습니다. 다른 파일을 올리셨는지 확인해 주세요.':((res&&res.warnings&&res.warnings[0])||'내용을 알아보지 못했습니다.'));
    }
    var g=summarize(res);
    /* 소재지번을 못 읽었으면 등기부가 아니거나 거의 읽지 못한 것 — 빈 미리보기를 「정확도 높음」으로 보여주지 않는다 */
    if(!has(g.addr))throw new Error('등기부를 제대로 읽지 못했습니다. <a href="https://www.iros.go.kr" target="_blank" rel="noopener">인터넷등기소</a>에서 등기사항전부증명서를 새로 발급받아 PDF로 올리면 정확하게 읽힙니다.');
    /* 새 등기부를 올리면 부동산 칸을 고친 값은 버리고, 매도인은 새 등기부 소유자로 바꾼다(같은 이름이면 적어 둔 주소 유지) */
    var E=S.hub.edit||{};['addr','jibun','apt','dong','floor','ho','struct','area','land','uid'].forEach(function(k){delete E[k];});
    if(S.hub.party&&g.owners.length){var old=S.hub.party.s;S.hub.party.s=g.owners.slice(0,2).map(function(o){
      var m=old.filter(function(q){return q.name===o.name;})[0];return {name:o.name,addr:m?m.addr:'',sd:g.owners.length>1?o.sd:'',sn:g.owners.length>1?o.sn:''};});}
    S.hub.reg=g;saveHub();OPEN.reup=false;
    track('hub_ocr_ok',{step:S.hub.reg.got});
    setOcr({busy:false,pct:1,say:'',err:''});
    toast('등기부에서 '+S.hub.reg.got+'칸을 채웠습니다');
    scrollToEl(document.getElementById('reg'));
  }).catch(function(e){var m=e&&e.message?e.message:String(e);setOcr({busy:false,say:'',err:'<b>읽지 못했습니다.</b> '+(/<a /.test(m)?m:esc(m))});});
}
/* 서류 작성 화면으로 넘길 때 올린 파일을 같이 넘긴다(서류 작성 페이지의 ?handoff=reg — 같은 IndexedDB) */
function handoff(href){
  if(!OCR.files||!window.indexedDB){location.href=href;return;}
  var r=indexedDB.open('sr_handoff',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('f');};
  r.onsuccess=function(){try{var tx=r.result.transaction('f','readwrite');tx.objectStore('f').put(OCR.files,'reg');tx.oncomplete=function(){location.href=href+(href.indexOf('?')<0?'?':'&')+'handoff=reg';};}catch(e){location.href=href;}};
  r.onerror=function(){location.href=href;};
}

/* ---------- 화면 가이드(guide.html 팝업과 같은 자료) ---------- */
var SH=(typeof SHOTS!=='undefined'?SHOTS:window.SHOTS)||[];
function shotOf(key){for(var i=0;i<SH.length;i++)if(SH[i].key===key)return SH[i];return null;}
function parseCap(d){var src=null,tip=null,body=d;
  var mRec=body.match(/\s*\(재현 이미지[^)]*\)\s*/);if(mRec){src='rec';body=body.replace(mRec[0],' ');}
  if(body.indexOf('(실제 화면)')>-1){src='real';body=body.replace('(실제 화면)','');}
  var st=body.indexOf('★');if(st>-1){tip=body.slice(st+1).trim();body=body.slice(0,st);}
  return {body:body.trim(),tip:tip,src:src};}
var GM=document.getElementById('gm'),G={cur:null,step:0,back:null};
function openShot(key){G.cur=shotOf(key);if(!G.cur)return;G.step=0;G.back=document.activeElement;GM.hidden=false;document.body.style.overflow='hidden';drawShot();track('hub_shot',{key:key});document.getElementById('gmNext').focus();}
function closeShot(){GM.hidden=true;document.body.style.overflow='';G.cur=null;if(G.back&&G.back.focus)try{G.back.focus();}catch(e){}}
function drawShot(){
  var s=G.cur,p=s.steps[G.step],cap=parseCap(p.d),n=s.steps.length;
  document.getElementById('gmT').innerHTML=esc(s.title)+'<small>'+(G.step+1)+' / '+n+'</small>';
  document.getElementById('gmB').innerHTML='<div class="gm-img">'+(cap.src?'<span class="gm-badge">'+(cap.src==='real'?'실제 화면':'재현 이미지')+'</span>':'')
    +'<img src="'+esc(p.img)+'" alt="'+esc(p.t)+' 화면"></div>'
    +'<h3 class="gm-t">'+(G.step+1)+'. '+esc(p.t)+'</h3><p class="gm-d">'+esc(cap.body)+'</p>'
    +(cap.tip?'<p class="tip"><b>TIP</b> '+esc(cap.tip)+'</p>':'')
    +'<div class="gm-dots">'+s.steps.map(function(_,i){return '<button type="button" data-gs="'+i+'" class="'+(i===G.step?'on':'')+'" aria-label="'+(i+1)+'단계"></button>';}).join('')+'</div>';
  document.getElementById('gmB').scrollTop=0;
  document.getElementById('gmPrev').disabled=G.step===0;
  document.getElementById('gmNext').textContent=G.step===n-1?'다 봤어요':'다음';
  for(var i=1;i<=2;i++){var nx=s.steps[G.step+i];if(nx){var im=new Image();im.src=nx.img;}}
  document.querySelectorAll('[data-gs]').forEach(function(b){b.onclick=function(){G.step=+b.getAttribute('data-gs');drawShot();};});
}
function stepShot(d){if(!G.cur)return;var n=G.cur.steps.length;if(G.step+d<0)return;if(G.step+d>=n){closeShot();return;}G.step+=d;drawShot();}
document.getElementById('gmPrev').onclick=function(){stepShot(-1);};
document.getElementById('gmNext').onclick=function(){stepShot(1);};
document.getElementById('gmX').onclick=closeShot;
GM.addEventListener('click',function(e){if(e.target===GM)closeShot();});
document.addEventListener('keydown',function(e){if(GM.hidden)return;if(e.key==='Escape')closeShot();if(e.key==='ArrowLeft')stepShot(-1);if(e.key==='ArrowRight')stepShot(1);});
(function(){var x0=null,b=document.getElementById('gmB');
  b.addEventListener('touchstart',function(e){x0=e.touches.length===1?e.touches[0].clientX:null;},{passive:true});
  b.addEventListener('touchend',function(e){if(x0==null)return;var dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50)stepShot(dx<0?1:-1);});})();

/* ---------- 동작 ---------- */
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on');},2200);}
function scrollToEl(el){if(el)window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-70,behavior:'smooth'});}
function goTask(k){if(k==='reg'){scrollToEl(document.getElementById('reg'));return;}OPEN[k]=true;render();scrollToEl(document.getElementById('t-'+k));}
function bind(){
  var b=document.getElementById('bal');
  if(b)b.addEventListener('change',function(){S.hub.balance=b.value||'';saveHub();track('hub_balance',{});render();});
  var fi=document.getElementById('fi'),dz=document.getElementById('dz');
  if(fi)fi.onchange=function(){readReg(fi.files);};
  if(dz){['dragenter','dragover'].forEach(function(t){dz.addEventListener(t,function(e){e.preventDefault();dz.classList.add('over');});});
    ['dragleave','drop'].forEach(function(t){dz.addEventListener(t,function(e){e.preventDefault();dz.classList.remove('over');});});
    dz.addEventListener('drop',function(e){var fl=e.dataTransfer&&e.dataTransfer.files;if(fl&&fl.length)readReg(fl);});}
  A.querySelectorAll('[data-reup]').forEach(function(x){x.onclick=function(){OPEN.reup=x.getAttribute('data-reup')==='1';OCR.err='';render();};});
  A.querySelectorAll('[data-all]').forEach(function(x){x.onclick=function(){track('hub_door',{key:'all'});scrollToEl(document.getElementById('ph-pre'));};});
  A.querySelectorAll('[data-handoff]').forEach(function(x){x.addEventListener('click',function(e){e.preventDefault();track('hub_handoff',{});handoff(x.getAttribute('href'));});});
  A.querySelectorAll('[data-tg]').forEach(function(x){x.onclick=function(){var k=x.getAttribute('data-tg');if(k==='pass')return;OPEN[k]=!OPEN[k];if(OPEN[k])track('hub_task',{key:k});render();};});
  A.querySelectorAll('[data-go]').forEach(function(x){x.onclick=function(){var k=x.getAttribute('data-go');track('hub_now',{key:k});goTask(k);};});
  A.querySelectorAll('[data-shot]').forEach(function(x){x.onclick=function(){openShot(x.getAttribute('data-shot'));};});
  A.querySelectorAll('[data-pre]').forEach(function(x){x.onclick=function(){var k=x.getAttribute('data-pre');S.hub.pre=S.hub.pre||{};
    if(k==='none'){S.hub.pre={};S.hub.asked=1;OPEN.ask=false;saveHub();track('hub_pre',{step:0});var nk=nowKey();render();if(nk&&nk!=='reg')goTask(nk);return;}
    S.hub.pre[k]=S.hub.pre[k]?0:1;saveHub();render();};});
  A.querySelectorAll('[data-ask]').forEach(function(x){x.onclick=function(){
    if(x.getAttribute('data-ask')==='open'){OPEN.ask=true;render();return;}
    S.hub.asked=1;OPEN.ask=false;saveHub();var P=S.hub.pre||{};track('hub_pre',{step:PAY.filter(function(k){return P[k];}).length});
    var nk=nowKey();render();if(nk&&nk!=='reg')goTask(nk);};});
  A.querySelectorAll('[data-ck]').forEach(function(x){x.onchange=function(){var id=x.getAttribute('data-ck'),st=x.getAttribute('data-store');S.hub[st]=S.hub[st]||{};if(x.checked)S.hub[st][id]=1;else delete S.hub[st][id];saveHub();render();};});
  A.querySelectorAll('input[data-num="1"]').forEach(function(i){i.addEventListener('input',function(){var d=digits(i.value);i.value=d?Number(d).toLocaleString('ko-KR'):'';});});
  A.querySelectorAll('[data-save]').forEach(function(x){x.onclick=function(){var k=x.getAttribute('data-save'),vals={},n=0;
    A.querySelectorAll('#p-'+k+' [data-f]').forEach(function(i){var v=i.value.trim();if(i.getAttribute('data-num')==='1')v=digits(v);vals[i.getAttribute('data-f')]=v;if(v)n++;});
    if(!n)return toast('하나 이상 적어 주세요');
    saveRelay(vals);track('hub_save',{key:k});OPEN[k]=false;toast('저장했습니다');var nk=nowKey();render();if(nk&&nk!=='reg'&&!blocked(nk))goTask(nk);};});
  A.querySelectorAll('[data-edit]').forEach(function(x){x.onclick=function(){var k=x.getAttribute('data-edit');OPEN['ed_'+k]=true;render();var i=A.querySelector('[data-ed="'+k+'"]');if(i)i.focus();};});
  function edSave(k){
    var E=S.hub.edit=S.hub.edit||{};
    if(k==='addr'){A.querySelectorAll('[data-sub]').forEach(function(i){var f=i.getAttribute('data-sub'),v=i.value.trim();
        if(f==='dong')v=v.replace(/^제\s*|\s*동$/g,'');if(f==='floor')v=v.replace(/^제\s*|\s*층$/g,'');if(f==='ho')v=v.replace(/^제\s*|\s*호$/g,'');
        if(v)E[f]=v;else delete E[f];});
      delete E.addr;
    }else{
      var i=document.getElementById('ed-'+k);if(!i)return;var v=i.value.trim();
      if(k==='price')v=digits(v);if(k==='area')v=v.replace(/\s*(㎡|m2|m²)$/,'');
      if(k==='land'&&v&&!frac(v))return toast('「38520.6분의 41.27」처럼 적어 주세요');
      if(k==='share'&&v&&v!=='전부'&&!frac(v))return toast('「3분의 1」처럼 적어 주세요');
      if(k==='seller'||k==='buyer'){
        var names=v.split(/\s*[,，]\s*/).filter(Boolean).slice(0,2),P=S.hub.party=S.hub.party||party(),arr=P[k==='seller'?'s':'b'];
        if(!names.length)names=[''];
        names.forEach(function(n,j){arr[j]=arr[j]||{name:'',addr:'',sd:'',sn:''};arr[j].name=n;});arr.length=names.length;
      }else if(v)E[k]=v;else delete E[k];
    }
    OPEN['ed_'+k]=false;saveHub();track('hub_edit',{key:k});render();}
  A.querySelectorAll('[data-edok]').forEach(function(x){x.onclick=function(){edSave(x.getAttribute('data-edok'));};});
  A.querySelectorAll('[data-ed]').forEach(function(i){var k=i.getAttribute('data-ed');
    if(i.tagName==='SELECT')i.onchange=function(){if(i.value==='직접 입력'){var p=i.parentNode;p.innerHTML='<input id="ed-share" class="pv-in pv-wide" data-ed="share" placeholder="예: 3분의 1"> <button type="button" class="pv-x" data-edok="share">완료</button>';
        p.querySelector('[data-edok]').onclick=function(){edSave('share');};document.getElementById('ed-share').focus();return;}edSave(k);};
    else i.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();edSave(k);}};});
  A.querySelectorAll('[data-siga]').forEach(function(x){x.onclick=sigaGo;});
  var cz=document.getElementById('cause');if(cz)cz.onchange=function(){if(!cz.value)return;S.hub.cause=cz.value;OPEN.cause=false;saveHub();track('hub_edit',{key:'cause'});render();};
  A.querySelectorAll('[data-cause]').forEach(function(x){x.onclick=function(){OPEN.cause=true;render();var c=document.getElementById('cause');if(c)c.focus();};});
  var rc=document.getElementById('rcpt');
  if(rc)rc.onchange=function(){var fl=rc.files&&rc.files[0],msg=document.getElementById('rcptMsg');rc.value='';if(!fl||!window.SRReceipt)return;
    msg.textContent='읽는 중…';
    SRReceipt.parse(fl).then(function(r){track('receipt_ocr',{key:r.kind,from:'hub'});
      if(r.kind!=='receipt'){msg.textContent=r.msg;return;}
      [['tax',r.tax],['edu',r.edu],['rural',r.rural||''],['siga',r.siga]].forEach(function(p){var el=document.getElementById('f-'+p[0]);if(el&&p[1])el.value=Number(p[1]).toLocaleString('ko-KR');});
      msg.textContent=r.sumOk?'채웠습니다 — 세액 합계 '+Number(r.total).toLocaleString('ko-KR')+'원 일치. 「저장」을 누르세요.':'채웠습니다. 세액 합계가 맞지 않아 납부확인서와 대조해 주세요.';
    });};
  A.querySelectorAll('[data-stamp="0"]').forEach(function(x){x.onclick=function(){S.fin.stamp=false;if(!demoOn()){var fl=rd(K.flow)||{};fl.fin=fl.fin||{};delete fl.fin.stamp;wr(K.flow,fl);}render();};});
  A.querySelectorAll('[data-stamp="1"]').forEach(function(x){x.onclick=function(){saveFin('stamp');OPEN.stamp=false;toast('저장했습니다');render();};});
  A.querySelectorAll('[data-mark]').forEach(function(x){x.onclick=function(){var k=x.getAttribute('data-mark');S.hub[k]=true;saveHub();OPEN[k==='rjok'?'rj':k]=false;render();};});
}

/* 시제품 예시 상태 전환 */
var DS=document.getElementById('demoS');
function setMode(k){mode=k;var d=DEMOS.filter(function(x){return x.k===k;})[0];
  S=k==='real'?realState():clone(d.s);OPEN={};OCR={busy:false,err:'',files:null,pct:0,say:''};
  DS.querySelectorAll('[data-demo]').forEach(function(x){x.setAttribute('aria-pressed',String(x.getAttribute('data-demo')===k));});}
DS.innerHTML=DEMOS.map(function(d){return '<button type="button" data-demo="'+d.k+'" aria-pressed="'+(d.k===mode)+'">'+d.t+'</button>';}).join('');
DS.querySelectorAll('[data-demo]').forEach(function(btn){btn.onclick=function(){setMode(btn.getAttribute('data-demo'));render();window.scrollTo(0,0);};});

window.addEventListener('storage',function(){if(!demoOn()){S=realState();render();}});
syncForm(true);
render();
})();
