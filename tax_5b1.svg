<text x="208" y="255" font-size="8.6" fill="#8a6420">[세대정보 조회]를 누르면 「세대정보조회」 창에 주민등록표상 세대원과 가족관계등록정보가 나옵니다.</text>
<text x="208" y="272" font-size="8.6" fill="#8a6420">세대원을 모두 선택하고 취득자와의 관계·1세대 포함 여부를 고른 뒤 [확인]을 누릅니다(동거인 제외).</text>
<text x="208" y="289" font-size="8.6" fill="#8a6420">주소를 달리하는 배우자·30세 미만 미혼 자녀가 있으면 [추가]로 함께 입력합니다.</text>
<text x="208" y="306" font-size="8.6" fill="#8a6420">취득자가 30세 미만·미혼이면 주민등록을 달리하는 부모도 입력합니다.</text>
<text x="208" y="323" font-size="8.6" fill="#8a6420">조회되지 않는 세대원은 주민등록등본·가족관계증명서를 구비서류로 제출합니다.</text>
